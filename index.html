<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management System</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; background-color: #f4f4f9; }
        .container { max-width: 800px; margin: auto; background: white; padding: 20px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #333; }
        form { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
        input { padding: 10px; flex: 1; border: 1px solid #ccc; border-radius: 4px; min-width: 150px; }
        button { padding: 10px 20px; cursor: pointer; background: #0056b3; color: white; border: none; border-radius: 4px; }
        button:hover { background: #004494; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { padding: 12px; border: 1px solid #ddd; text-align: left; }
        th { background-color: #0056b3; color: white; }
        .btn-edit { background: #28a745; padding: 5px 10px; color: white; border: none; cursor: pointer; border-radius: 3px; }
        .btn-delete { background: #dc3545; padding: 5px 10px; color: white; border: none; cursor: pointer; border-radius: 3px; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Student Management System</h2>
        
        <!-- Student Data Form -->
        <form id="studentForm">
            <input type="text" id="name" placeholder="Student Name" required>
            <input type="text" id="indexNo" placeholder="Index Number" required>
            <input type="text" id="course" placeholder="Course Name" required>
            <button type="submit" id="submitBtn">Add Student</button>
        </form>

        <!-- Students Data Table -->
        <table>
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Index Number</th>
                    <th>Course</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="studentTableBody">
                <!-- Data will be inserted here via JavaScript -->
            </tbody>
        </table>
    </div>

    <!-- Connect JavaScript File -->
    <script src="app.js"></script>
</body>
</html>
